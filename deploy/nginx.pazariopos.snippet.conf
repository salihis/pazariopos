# deploy/nginx.pazariopos.snippet.conf
# ─────────────────────────────────────────────────────────────
# NOT used standalone — this gets inserted into the EXISTING shared
# nginx config at /home/ubuntu/pazario/nginx.deploy.conf, inside its
# `http { ... }` block (see deploy/insert_pazariopos_nginx_block.py,
# which does this safely with an automatic backup).
#
# Routes erp.pazario.tr to the pazariopos-server/pazariopos-web
# containers over the pazario-net Docker network they share with the
# marketplace stack. Does not touch the existing pazario.tr /
# www.pazario.tr server block at all.
# ─────────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name erp.pazario.tr;

        # Docker's embedded DNS resolver (127.0.0.11) + a `set` variable
        # makes nginx resolve pazariopos-server/pazariopos-web lazily, at
        # REQUEST time, instead of once at nginx startup (which a plain
        # `upstream {}` block or a literal proxy_pass hostname would do).
        # This matters a lot here specifically because nginx is SHARED
        # with the live marketplace site: if this used a static upstream
        # and the pazariopos containers were ever down when nginx
        # (re)starts, nginx would refuse to start AT ALL — taking down
        # pazario.tr too. This way, a down pazariopos stack only 502s on
        # erp.pazario.tr; pazario.tr is completely unaffected either way.
        resolver 127.0.0.11 valid=30s;

        location /api/ {
            set $pazariopos_backend http://pazariopos-server:3000;
            proxy_pass $pazariopos_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        location / {
            set $pazariopos_web http://pazariopos-web:80;
            proxy_pass $pazariopos_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        client_max_body_size 10m;
    }
