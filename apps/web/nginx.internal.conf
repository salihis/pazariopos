# apps/web/nginx.internal.conf
# ─────────────────────────────────────────────────────────────
# Config for the INTERNAL nginx that just serves the built web app's
# static files inside the pazariopos-web container. This is NOT
# internet-facing — the shared host nginx (/home/ubuntu/pazario on the
# VPS) proxies erp.pazario.tr's "/" requests to this container over
# the internal pazario-net Docker network. No SSL, no server_name
# matching needed here — that's the outer nginx's job.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
